<!doctype html>
<!-- Static, synthetic approval markup for responsive CSS review. No API or live approval is used. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Approval layout preview</title>
    <link rel="stylesheet" href="../../apps/web/app/globals.css?v=2" />
    <style>
      :root { --font-sans: system-ui; --font-mono: ui-monospace; }
      section:has(.pay-anchor) dl div { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px; margin-top: 8px; }
      section:has(.pay-anchor) dl dd { margin: 0; }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-nav"><a class="brand" href="#">Trusty Squire</a></header>
      <main class="app-main" id="preview"></main>
    </div>
    <script>
      const samples = {
        pay: `<div class="app-head"><div><h1 class="app-title">Approve payment</h1><p class="app-sub">Use your passkey to privately review this payment request.</p></div></div>
          <section class="app-card"><h2 class="app-title" style="font-size:18px">CASETiFY</h2><p class="app-sub" style="margin-top:12px">Paying at https://casetify.com</p>
          <dl class="app-sub" style="margin:16px 0 0"><div><dt>Item</dt><dd class="mono">phone case</dd></div><div><dt>Requested by</dt><dd class="mono">claude-code</dd></div><div><dt>Reason</dt><dd class="mono">gift</dd></div></dl>
          <p class="pay-anchor">Pay with <span class="mono">Personal •••• 4242</span> · $60.00 to CASETiFY</p>
          <div class="approval-actions"><button class="btn-primary">Approve payment</button><button class="btn-secondary">Deny payment</button></div></section>`,
        fetch: `<div class="app-head"><div><h1 class="app-title approval-question" id="credential-target">Reveal AWS (production-billing-exporter) Access key ID, Secret access key, and Session token to your agent?</h1></div></div>
          <section class="app-card" aria-labelledby="credential-target"><p class="app-sub" style="margin-top:0">Requested by claude-code</p>
          <dl class="app-sub" style="margin:12px 0 0"><dt>Reason given</dt><dd class="mono" style="margin:8px 0 0">“Complete the monthly billing export.”</dd></dl>
          <p class="app-sub" style="margin-top:12px">Your agent sees these values once, in clear, and they stay in that conversation. Expires in 10 minutes.</p>
          <div class="approval-actions"><button class="btn-primary">Approve reveal</button><button class="btn-deny">Deny</button></div></section>`,
        mutate: `<div class="app-head"><div><h1 class="app-title">Approve credential edit</h1><p class="app-sub">Review the exact target and metadata change, then confirm with your passkey.</p></div></div>
          <section class="app-card"><h2 class="app-title" style="font-size:var(--t-lg)">OpenAI · prod</h2><p class="mono app-sub">vault://account/subscription/credential</p>
          <div style="margin-top:24px"><p class="sect-label">Before</p><p class="app-sub">Allowed hosts: api.openai.com</p></div><div style="margin-top:24px"><p class="sect-label">After</p><p class="app-sub">Allowed hosts: api.openai.com, uploads.openai.com</p></div>
          <div class="approval-actions"><button class="btn-primary">Approve edit</button><button class="btn-secondary">Cancel</button></div><p class="app-sub">Cancel leaves this request pending until it expires.</p></section>`,
        card: `<div class="app-head"><div><h1 class="app-title">Edit saved card</h1><p class="app-sub">The card opens here in your browser, decrypted with your passkey. Edit the fields and confirm — your card details are re-encrypted locally and our servers never see them.</p></div></div>
          <section class="app-card"><h2 class="app-title" style="font-size:var(--t-lg)">Personal</h2><p class="mono app-sub">•••• •••• •••• 4242 · Visa</p>
          <div class="approval-actions"><button class="btn-primary">Edit card details</button><button class="btn-secondary">Cancel</button></div><p class="app-sub">Cancel leaves this request pending until it expires.</p></section>`,
        passkey: `<div class="app-head"><div><h1 class="app-title">Passkey recovery</h1></div></div><section class="app-card"><p class="form-err">We couldn't recover your existing passkey. Choose how to continue.</p>
          <div class="approval-actions"><button class="btn-primary">Use your existing passkey</button><button class="btn-secondary">Create a new passkey</button></div></section>`,
      };
      document.getElementById("preview").innerHTML = samples[new URLSearchParams(location.search).get("case")] || samples.pay;
    </script>
  </body>
</html>
