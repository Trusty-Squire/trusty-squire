<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Trusty Squire — sign in</title>
    <!-- This page uses only noVNC's stable RFB API. The VNC password is read
       from the URL fragment so it is never sent to the tunnel or proxy. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f1115;
        color: #e6e8ec;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #bar {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: #171a21;
        border-bottom: 1px solid #272b35;
        font-size: 13px;
        line-height: 1.35;
        flex-wrap: wrap;
      }
      #bar b {
        color: #fff;
      }
      #bar span.sub {
        color: #9aa0ab;
      }
      #dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #e0a23a;
        flex: none;
      }
      #dot.ok {
        background: #3fb950;
      }
      #dot.err {
        background: #f85149;
      }
      #screen {
        flex: 1;
        position: relative;
        background: #0f1115;
        min-height: 0;
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        text-align: center;
        transform: translateY(-50%);
        color: #9aa0ab;
        font-size: 14px;
        padding: 0 24px;
        pointer-events: none;
        z-index: 9;
      }
      #kb {
        position: fixed;
        right: 16px;
        bottom: max(96px, env(safe-area-inset-bottom, 16px));
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        border: none;
        background: #4f46e5;
        color: #fff;
        font-size: 28px;
        line-height: 1;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
        cursor: pointer;
        z-index: 20;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        transition:
          background 120ms,
          transform 80ms;
      }
      #kb:active,
      #kb.tapped {
        transform: scale(0.92);
        background: #3fb950;
      }
      #kbInput {
        position: fixed;
        left: -40px;
        top: 0;
        width: 1px;
        height: 1px;
        background: #fff;
        color: #fff;
        caret-color: transparent;
        border: 0;
        padding: 0;
        margin: 0;
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <span id="dot"></span>
      <b>Trusty Squire</b>
      <span class="sub">— sign in to your account, then return to your terminal.</span>
    </div>
    <div id="screen"></div>
    <div id="msg">Connecting to the secure login window&hellip;</div>
    <input
      id="kbInput"
      type="text"
      inputmode="text"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      aria-hidden="true"
      tabindex="-1"
    />
    <button id="kb" type="button" aria-label="Show keyboard">⌨</button>
    <script type="module">
      import RFB from "./core/rfb.js";
      import keysyms from "./core/input/keysymdef.js";
      import { sendTextAsKeysyms } from "./vnc-input.js";

      const params = new URLSearchParams(location.hash.replace(/^#/, ""));
      const password = params.get("p") || params.get("password") || "";
      const dot = document.getElementById("dot");
      const msg = document.getElementById("msg");
      const screen = document.getElementById("screen");
      const kbBtn = document.getElementById("kb");
      const kbInput = document.getElementById("kbInput");
      const wsUrl =
        (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/websockify";

      let rfb;
      try {
        rfb = new RFB(screen, wsUrl, { credentials: { password }, shared: true });
        rfb.scaleViewport = true;
        rfb.resizeSession = false;
      } catch (err) {
        dot.className = "err";
        msg.textContent = "Could not start the login window: " + err;
      }

      if (rfb) {
        rfb.addEventListener("connect", () => {
          dot.className = "ok";
          msg.style.display = "none";
        });
        rfb.addEventListener("disconnect", () => {
          dot.className = "err";
          msg.style.display = "";
          msg.textContent =
            "Login window closed. If you finished signing in, return to " +
            "your terminal — you can close this tab.";
        });
        rfb.addEventListener("securityfailure", () => {
          dot.className = "err";
          msg.style.display = "";
          msg.textContent = "Could not authenticate to the login window.";
        });

        kbBtn.addEventListener("click", (event) => {
          event.preventDefault();
          kbBtn.classList.add("tapped");
          setTimeout(() => kbBtn.classList.remove("tapped"), 200);
          kbInput.blur();
          kbInput.value = "";
          kbInput.focus();
        });

        const SPECIAL_KEYS = {
          Backspace: 0xff08,
          Tab: 0xff09,
          Enter: 0xff0d,
          Escape: 0xff1b,
          ArrowLeft: 0xff51,
          ArrowUp: 0xff52,
          ArrowRight: 0xff53,
          ArrowDown: 0xff54,
          Delete: 0xffff,
        };

        kbInput.addEventListener("input", () => {
          sendTextAsKeysyms(rfb, kbInput.value, keysyms);
          kbInput.value = "";
        });

        kbInput.addEventListener("keydown", (event) => {
          const keysym = SPECIAL_KEYS[event.key];
          if (keysym !== undefined) {
            event.preventDefault();
            rfb.sendKey(keysym, event.code, true);
            rfb.sendKey(keysym, event.code, false);
          }
        });
      }
    </script>
  </body>
</html>
