name: Release sdk

# Publishes @trusty-squire/sdk to npm whenever the version in
# packages/sdk/package.json is new on `main`.
#
# Source of truth: packages/sdk/package.json `version` field.
#   - main: must be a stable semver. Publishes `latest` tag.
#
# Tag scheme: `sdk@<version>` (avoids collision with mcp's `v<version>` tags).
# If the tag already exists OR npm already has that version, publish is skipped.
# If npm has the version but the tag is missing (a run that published and then
# failed), the `release` job creates only the GitHub release.
#
# Publishing is version-driven. README edits also trigger a run, which skips
# when the version is already released.
#
# Auth: npm trusted publishing (OIDC). No npm token is stored in GitHub.
# npmjs.com > @trusty-squire/sdk > Settings > Trusted publisher must name:
#   organization `Trusty-Squire`, repository `trusty-squire`,
#   workflow `release-sdk.yml`, environment `npm-publish`.
# These fields are case-sensitive. Requires Node >= 22.14 and npm >= 11.5.1.

on:
  push:
    branches: [main]
    paths:
      - "packages/sdk/package.json"
      - "packages/sdk/README.md"
      - "pnpm-lock.yaml"
      - ".github/workflows/release-sdk.yml"

concurrency:
  group: release-sdk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag_exists: ${{ steps.read.outputs.tag_exists }}
      npm_dist_tag: ${{ steps.read.outputs.npm_dist_tag }}
      gh_prerelease: ${{ steps.read.outputs.gh_prerelease }}
      should_publish: ${{ steps.read.outputs.should_publish }}
      should_release: ${{ steps.read.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-path already released versions
        id: fast_path
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/sdk/package.json').version")
          TAG="sdk@$VERSION"
          if git rev-parse --quiet --verify "refs/tags/$TAG" >/dev/null \
            || npm view "@trusty-squire/sdk@$VERSION" version >/dev/null 2>&1; then
            echo "already_released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping expensive verification: sdk $VERSION is already released."
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.fast_path.outputs.already_released != 'true'
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        if: steps.fast_path.outputs.already_released != 'true'
        with:
          node-version: 20.11.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        if: steps.fast_path.outputs.already_released != 'true'
        run: pnpm install --frozen-lockfile --filter '@trusty-squire/sdk'

      - name: Typecheck sdk
        if: steps.fast_path.outputs.already_released != 'true'
        run: pnpm --filter '@trusty-squire/sdk' typecheck

      - name: Test sdk
        if: steps.fast_path.outputs.already_released != 'true'
        run: pnpm --filter '@trusty-squire/sdk' test

      - name: Build sdk
        if: steps.fast_path.outputs.already_released != 'true'
        run: pnpm --filter '@trusty-squire/sdk' build

      - name: Read package version + decide
        id: read
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/sdk/package.json').version")
          BRANCH="${GITHUB_REF_NAME}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Branch:  $BRANCH"
          echo "Version: $VERSION"

          if [[ "$VERSION" == *"-"* ]]; then IS_PRE=true; else IS_PRE=false; fi

          if [[ "$BRANCH" == "main" && "$IS_PRE" == "true" ]]; then
            echo "::error::main branch requires a stable version, got prerelease: $VERSION"
            exit 1
          fi

          TAG="sdk@$VERSION"
          if git rev-parse --quiet --verify "refs/tags/$TAG" >/dev/null; then
            TAG_EXISTS=true
          else
            TAG_EXISTS=false
          fi
          echo "tag_exists=$TAG_EXISTS" >> "$GITHUB_OUTPUT"

          if [[ "$IS_PRE" == "true" ]]; then
            echo "npm_dist_tag=next"  >> "$GITHUB_OUTPUT"
            echo "gh_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm_dist_tag=latest" >> "$GITHUB_OUTPUT"
            echo "gh_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          if npm view "@trusty-squire/sdk@$VERSION" version >/dev/null 2>&1; then
            NPM_HAS=true
          else
            NPM_HAS=false
          fi
          echo "npm_has=$NPM_HAS"

          if [[ "$TAG_EXISTS" == "true" || "$NPM_HAS" == "true" ]]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping publish: version $VERSION already released (tag_exists=$TAG_EXISTS, npm_has=$NPM_HAS)"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

          # Release-only path: npm has the version but the GitHub release is missing.
          if [[ "$TAG_EXISTS" == "false" && "$NPM_HAS" == "true" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::npm has $VERSION but tag $TAG is missing; creating the GitHub release only."
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: verify
    if: needs.verify.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    # The npm trusted publisher config names this environment.
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      # No registry-url: it writes an .npmrc token line that npm does not need
      # under OIDC. npm defaults to registry.npmjs.org.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install npm with trusted publishing support
        run: |
          set -euo pipefail
          npm install -g npm@latest
          node --version
          npm --version
          node -e '
            const [a,b,c]=process.versions.node.split(".").map(Number);
            const [x,y,z]=require("child_process").execSync("npm --version").toString().trim().split(".").map(Number);
            const ge=(p,q)=>p[0]!==q[0]?p[0]>q[0]:p[1]!==q[1]?p[1]>q[1]:p[2]>=q[2];
            if(!ge([a,b,c],[22,14,0])){console.error("::error::Node >= 22.14.0 required");process.exit(1)}
            if(!ge([x,y,z],[11,5,1])){console.error("::error::npm >= 11.5.1 required");process.exit(1)}
          '

      - name: Install
        run: pnpm install --frozen-lockfile --filter '@trusty-squire/sdk'

      - name: Clean + build sdk
        working-directory: packages/sdk
        run: |
          rm -rf dist
          pnpm build
          # Sentinels: refuse to publish if the build omitted required runtime exports.
          for EXPORT in Squire openApproval; do
            if ! grep -q "$EXPORT" dist/index.js; then
              echo "::error::Built dist/index.js is missing $EXPORT — refusing to publish broken tarball"
              exit 1
            fi
          done

      # npm publish, not pnpm publish: pnpm 8 cannot do OIDC. npm does not
      # rewrite `workspace:` specifiers, so refuse to publish if any appear.
      - name: Publish to npm
        working-directory: packages/sdk
        run: |
          set -euo pipefail
          if grep -q '"workspace:' package.json; then
            echo "::error::package.json has workspace: specifiers; npm publish would ship them verbatim"
            exit 1
          fi
          V="${{ needs.verify.outputs.version }}"
          TAG="${{ needs.verify.outputs.npm_dist_tag }}"
          echo "Publishing @trusty-squire/sdk@$V with dist-tag $TAG"
          npm publish --access public --tag "$TAG" --provenance

      # Ground truth: never trust pnpm/npm stdout. Use `npm view` (metadata
      # index) — that's what real users hit. Tarball CDN can lag 5-10min.
      - name: Verify version is live on registry
        run: |
          set -euo pipefail
          V="${{ needs.verify.outputs.version }}"
          echo "Polling: npm view @trusty-squire/sdk@$V version (up to 5min) ..."
          for i in $(seq 1 30); do
            FOUND=$(npm view "@trusty-squire/sdk@$V" version 2>/dev/null || echo "")
            echo "  attempt $i → '$FOUND'"
            if [[ "$FOUND" == "$V" ]]; then
              echo "✓ Version $V is live on registry."
              break
            fi
            if [[ "$i" == "30" ]]; then
              echo "::error::Version $V not on registry after 5min. npm publish lied."
              exit 1
            fi
            sleep 10
          done

      # Extra-paranoid: download tarball + grep the runtime exports. Tarball CDN lags
      # the metadata index — skip if CDN not ready, downgrade to warning.
      - name: Verify tarball contents
        run: |
          set -euo pipefail
          V="${{ needs.verify.outputs.version }}"
          URL="https://registry.npmjs.org/@trusty-squire/sdk/-/sdk-$V.tgz"
          echo "Waiting for tarball CDN (up to 5min) ..."
          for i in $(seq 1 30); do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" -I "$URL")
            if [[ "$CODE" == "200" ]]; then
              echo "✓ Tarball CDN ready (attempt $i)"
              break
            fi
            if [[ "$i" == "30" ]]; then
              echo "::warning::Tarball CDN still 404 — skipping content check (metadata is live)."
              exit 0
            fi
            sleep 10
          done
          DIST_INDEX=$(mktemp)
          curl -sSL "$URL" | tar -xzO package/dist/index.js > "$DIST_INDEX"
          for EXPORT in Squire openApproval; do
            grep -q "$EXPORT" "$DIST_INDEX" \
              || { echo "::error::Published tarball missing $EXPORT"; exit 1; }
          done
          echo "✓ Tarball contains required runtime exports"

      # Read-only check that the dist-tag points at this version.
      - name: Verify dist-tag points at this version
        run: |
          set -euo pipefail
          V="${{ needs.verify.outputs.version }}"
          TAG="${{ needs.verify.outputs.npm_dist_tag }}"
          echo "Asserting dist-tag '$TAG' → $V"
          for i in $(seq 1 18); do
            CURRENT=$(npm view "@trusty-squire/sdk@$TAG" version 2>/dev/null || echo "")
            echo "  attempt $i — npm view says $TAG = '$CURRENT'"
            if [[ "$CURRENT" == "$V" ]]; then
              echo "✓ dist-tag $TAG correctly points at $V."
              exit 0
            fi
            sleep 10
          done
          echo "::error::dist-tag $TAG = '$CURRENT', expected '$V'."
          exit 1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ needs.verify.outputs.version }}"
          TAG="sdk@$V"
          PRERELEASE_FLAG=""
          if [[ "${{ needs.verify.outputs.gh_prerelease }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            $PRERELEASE_FLAG \
            --target "$GITHUB_SHA"

      - name: Summary
        run: |
          {
            echo "## Released @trusty-squire/sdk@${{ needs.verify.outputs.version }}"
            echo ""
            echo "- npm dist-tag: \`${{ needs.verify.outputs.npm_dist_tag }}\`"
            echo "- Tarball: https://registry.npmjs.org/@trusty-squire/sdk/-/sdk-${{ needs.verify.outputs.version }}.tgz"
          } >> "$GITHUB_STEP_SUMMARY"

  # Backfill the GitHub release for a version that is already on npm.
  # Never publishes to npm.
  release:
    needs: verify
    if: needs.verify.outputs.should_publish != 'true' && needs.verify.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ needs.verify.outputs.version }}"
          TAG="sdk@$V"
          # Tag this run's own commit. GITHUB_TOKEN got HTTP 403 tagging an
          # older commit whose workflow file differs from main (run 40616662124).
          # Name the commit npm built from in the notes.
          BUILT=$(npm view "@trusty-squire/sdk@$V" gitHead 2>/dev/null || echo "")
          if [[ -z "$BUILT" ]]; then
            BUILT=$(git log -1 --format=%H -- packages/sdk/package.json)
          fi
          echo "Creating release $TAG at $GITHUB_SHA (npm build: $BUILT)"
          PRERELEASE_FLAG=""
          if [[ "${{ needs.verify.outputs.gh_prerelease }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "npm @trusty-squire/sdk@$V was built from $BUILT. This tag marks main when the release was backfilled." \
            --generate-notes \
            $PRERELEASE_FLAG \
            --target "$GITHUB_SHA"

      - name: Summary
        run: |
          echo "## Created GitHub release sdk@${{ needs.verify.outputs.version }} (npm already had it)" >> "$GITHUB_STEP_SUMMARY"
